# PostgreSQL Test Configuration
javax.persistence.jdbc.url=jdbc:postgresql://localhost:5432/todolist_test
javax.persistence.jdbc.user=test_user
javax.persistence.jdbc.password=test_password
javax.persistence.jdbc.driver=org.postgresql.Driver
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.hbm2ddl.auto=create-drop
hibernate.show_sql=false
hibernate.format_sql=true

# MongoDB Test Configuration
mongodb.host=localhost
mongodb.port=27017
mongodb.database=todolist_test

# Redis Test Configuration
redis.host=localhost
redis.port=6379
redis.database=1

# Email Test Configuration
mail.smtp.host=localhost
mail.smtp.port=3025
mail.smtp.auth=false

# Logging
logging.level.root=WARN
logging.level.br.com.todolist=DEBUG
