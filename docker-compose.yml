version: '3.8'

# Rede customizada para comunicação entre containers
networks:
  todolist-network:
    driver: bridge

# Volumes persistentes para dados
volumes:
  postgres-data:
    driver: local
  mongodb-data:
    driver: local
  redis-data:
    driver: local

services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: todolist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: todolist
      POSTGRES_USER: todolist_user
      POSTGRES_PASSWORD: todolist_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - todolist-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todolist_user -d todolist"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: todolist-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_pass
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - todolist-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB para logs
  mongodb:
    image: mongo:7-jammy
    container_name: todolist-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass
      MONGO_INITDB_DATABASE: todolist_logs
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - todolist-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Aplicação ToDoList
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todolist-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      # Configurações do PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: todolist
      DB_USER: todolist_user
      DB_PASSWORD: todolist_pass
      
      # Configurações do Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Configurações do MongoDB
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: todolist_logs
      
      # Configurações da JVM
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m"
    networks:
      - todolist-network
    # Para aplicações GUI Swing, precisamos do X11
    # Descomente se quiser executar a GUI em container
    # environment:
    #   DISPLAY: ${DISPLAY}
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix:rw
